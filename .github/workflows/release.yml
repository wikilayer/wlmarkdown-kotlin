name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.7.1" >&2
            exit 1
          fi
          CHANGELOG_VERSION="$(sed -n 's/^## \[v\([0-9][0-9.]*\)\].*$/\1/p' CHANGELOG.md | head -1)"
          if [[ "$VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "version must match the latest CHANGELOG entry: $CHANGELOG_VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Install tools
        run: make install-tools
      - name: Build
        run: make build
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: make publish VERSION="$VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(sed -n "/^## \[v${VERSION}\] /,/^## /p" CHANGELOG.md | sed '1d;$d')"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "$NOTES"
